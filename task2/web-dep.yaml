apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-dep
  labels:
   app: nginx-task2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-task2
  template:
    metadata:
      labels:
        app: nginx-task2
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"

